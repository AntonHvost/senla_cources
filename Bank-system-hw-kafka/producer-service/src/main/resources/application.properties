datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bank_db}
datasource.username=${DB_USER:postgres}
datasource.password=${DB_PASSWORD:postgres}
datasource.driver=org.postgresql.Driver

jpa.hibernate.dll-auto=update
jpa.hibernate.show-sql=true
jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

kafka.servers=${KAFKA_SERVERS}
kafka.topic=${KAFKA_TOPIC}
